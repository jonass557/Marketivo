<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --theme-primary: #f97316;
      --theme-primary-hover: #ea580c;
      --theme-secondary: #1f2937;
      --theme-accent: #f97316;
    }
  </style>

  <!-- SEO : Balises principales -->
  <title>MyShop - Achetez et Vendez en ligne au Cameroun | E-commerce Afrique</title>
  <meta name="description"
    content="MyShop est la marketplace en ligne au Cameroun. Achetez des milliers de produits (électronique, mode, maison) livrés partout au Cameroun. Paiement Mobile Money, Orange Money et à la livraison. Devenez vendeur gratuitement !" />
  <meta name="keywords"
    content="e-commerce Cameroun, boutique en ligne, acheter en ligne Cameroun, vendre en ligne Afrique, marketplace Cameroun, Mobile Money, Orange Money, livraison Cameroun, MyShop, shopping Douala, shopping Yaoundé, XAF" />
  <meta name="author" content="MyShop" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://myshop.cm" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="MyShop - Achetez et Vendez en ligne au Cameroun" />
  <meta property="og:description"
    content="La marketplace N°1 au Cameroun. Des milliers de produits, paiement sécurisé, livraison rapide. Devenez vendeur gratuitement !" />
  <meta property="og:url" content="https://myshop.cm" />
  <meta property="og:site_name" content="MyShop" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:image" content="https://myshop.cm/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MyShop - Marketplace en ligne au Cameroun" />
  <meta name="twitter:description"
    content="Achetez et vendez en toute confiance. Livraison partout au Cameroun, paiement Mobile Money." />
  <meta name="twitter:image" content="https://myshop.cm/og-image.jpg" />

  <!-- Th\u00e8me mobile -->
  <meta name="theme-color" content="#f97316" />
  <meta name="msapplication-navbutton-color" content="#f97316" />
  <meta name="apple-mobile-web-app-status-bar-style" content="#f97316" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- Donn\u00e9es structur\u00e9es JSON-LD (Google Rich Snippets) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MyShop",
      "url": "https://myshop.cm",
      "description": "Marketplace en ligne au Cameroun. Achetez et vendez des produits en toute confiance.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://myshop.cm/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "MyShop",
      "url": "https://myshop.cm",
      "logo": "https://myshop.cm/vite.svg",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["French", "English"]
      }
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
